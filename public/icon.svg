<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable mode -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="98" fill="none" stroke="#1e293b" stroke-width="4"/>

  <!-- Outer dynamic health ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="20" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#flameGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="750" stroke-dashoffset="180"/>

  <!-- Flame & Leaf Central Icon -->
  <path d="M256 120 C220 180 180 230 180 290 C180 340 215 380 256 380 C297 380 332 340 332 290 C332 230 292 180 256 120 Z" fill="url(#flameGrad)" />
  
  <!-- Inner Energetic Ember -->
  <path d="M256 220 C240 255 220 280 220 310 C220 335 236 355 256 355 C276 355 292 335 292 310 C292 280 272 255 256 220 Z" fill="url(#innerGrad)" />

  <!-- Footprint / Droplet Accent -->
  <circle cx="256" cy="395" r="12" fill="#38bdf8"/>
</svg>
