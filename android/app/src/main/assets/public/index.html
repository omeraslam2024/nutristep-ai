      // Apply the saved/system theme before first paint so there is no flash of the wrong theme.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('nutristep_theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <script>
      // Gracefully silence harmless Vite dev server HMR WebSocket closure events in iframe sandbox
      window.addEventListener('error', function (event) {
        if (
          event &&
          event.message &&
          (event.message.includes('WebSocket') || event.message.includes('ws://') || event.message.includes('wss://'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        const reason = String(event && event.reason ? event.reason : '');
        if (reason.includes('WebSocket') || reason.includes('ws:') || reason.includes('wss:')) {
          event.preventDefault();
        }
      }, true);
    </script>
