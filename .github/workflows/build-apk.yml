name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutriStep-AI-Pixel7-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: NutriStep AI v1.1.2 - Status Bar & Menu Proportion Fix
          body: |
            ## 📱 NutriStep AI v1.1.2 (Status Bar & Menu Alignment Fix)
            
            ### 🔧 What was Fixed in this Release:
            - **Status Bar & Signal Bar Collision Fixed:** Added safe-area padding at the top of the header so NutriStep AI, Streak, and buttons now sit comfortably below the clock, camera hole, WiFi, and battery indicators.
            - **100% Proportional Menu Tabs:** Replaced the scrolling tabs with a clean 3-column segmented grid (`🍽️ Food` | `👟 Steps` | `📈 Reports`). No more clipped words or awkward edge cuts!
            - **7-Day Streak Alignment:** The mini 7-day flame history is now a neat 7-column grid that fits inside the card without overflowing.
            - **Full-Screen Responsive:** Zero white spaces, zero horizontal cutoff, edge-to-edge dark theme.
            
            ### 📲 How to Install the Update on Pixel 7:
            1. Tap **`app-debug.apk`** below to download directly to your phone.
            2. Tap the downloaded file in your browser notifications or Downloads folder.
            3. Tap **Update / Install**.
            4. Open NutriStep AI!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
