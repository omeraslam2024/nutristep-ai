name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutriStep-AI-Pixel7-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: NutriStep AI v1.0.0 for Pixel 7 (Direct APK)
          body: |
            ## 📱 NutriStep AI Android APK (Pixel 7 Ready)
            
            ### How to Install on Pixel 7:
            1. Tap **`app-debug.apk`** below to download directly to your phone.
            2. Tap the downloaded file in your notifications or Downloads folder.
            3. Tap **Install** (if prompted, allow install from your browser).
            4. Open NutriStep AI and start logging meals with Gemini Computer Vision and tracking steps!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
