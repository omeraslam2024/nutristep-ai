name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutriStep-AI-Pixel7-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: NutriStep AI v1.2.0 - Official Logo & Production Pedometer Engine
          body: |
            ## 📱 NutriStep AI v1.2.0 (Play Store Ready Production Release)
            
            ### 🍎 Official Healthy Progress Logo Integration:
            - **Native App Launcher Icon:** Replaced all placeholder icons across Android `mipmap` densities with the official **NutriStep Healthy Progress Logo** (Apple + climbing athlete + rising progress bars).
            - **Header & Branding:** The official brand icon is now displayed in the top header and splash.
            
            ### 👟 Pedometer / Step Counter Overhaul:
            - **Biomechanical Cadence Filtering:** Implemented linear acceleration isolation (removing 1G gravity bias) and cadence validation ($380\text{ms} - 1600\text{ms}$).
            - **Zero False Counts When Stationary:** The sensor requires continuous rhythmic footfalls, ignoring table vibrations, car movement, and holding the phone.
            - **Pause / Resume Controls:** Added 1-tap pause button for when sitting or driving.
            
            ### 🧭 Universal "Back to Home" Navigation:
            - Added universal `← Back to Home` buttons to all interior views (Daily Steps, Analytics Reports, Coach Drawer, Streak Modal, Plate Scanner, and Profile Settings).
            - Maintained pinned bottom navigation for 1-tap tab switching.
            
            ### 🎨 UI Scaling & Safe-Area Polishing:
            - Fixed Coach drawer scaling, text clipping, and safe-area top/bottom insets.
            - Clean 100% proportional tab bars and 7-day flame history.
            
            ### 📲 How to Install the Update on Pixel 7:
            1. Tap **`app-debug.apk`** below to download directly to your phone.
            2. Tap the downloaded file in your browser notifications or Downloads folder.
            3. Tap **Update / Install**.
            4. Open NutriStep AI!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
