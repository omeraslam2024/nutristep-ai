name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutriStep-AI-Pixel7-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: NutriStep AI v1.1.0 - Big Text & Graphical Edition (Pixel 7)
          body: |
            ## 📱 NutriStep AI v1.1.0 (Pixel 7 Ready)
            
            ### ✨ What's New in this Update:
            - **Big Text & High Contrast:** Extra-large fonts, giant calorie meters, and clear numbers that are easy to read from a distance.
            - **Ultra-Graphical & Low-Literacy Friendly:** Universal emojis (🍳 Breakfast, 🥗 Lunch, 🍲 Dinner, 🍎 Snacks, 👟 Steps, 💧 Water), traffic-light indicators (🟢 Green = On Track, 🔴 Red = Over limit).
            - **🔊 Voice Readout / Text-to-Speech:** Tap the "🔊 Hear Status" button anywhere to listen to your daily calories, meal summaries, and step count spoken aloud!
            - **Giant 1-Tap Navigation Bar:** Easy-to-tap 64px camera snap button and colorful bottom tabs.
            
            ### 📲 How to Install the Update on Pixel 7:
            1. Tap **`app-debug.apk`** below to download directly to your phone.
            2. Tap the downloaded file in your browser notifications or Downloads folder.
            3. Tap **Update / Install**.
            4. Open NutriStep AI!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
