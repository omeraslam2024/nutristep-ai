name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm install

      - name: Build Production Web App
        run: npm run build

      - name: Sync Capacitor Android Platform
        run: npx cap sync android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NutriStep-AI-Pixel7-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Release APK File
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: NutriStep AI v1.0.0 (Direct APK Install)
          body: |
            ## 📱 NutriStep AI - Direct Android APK
            
            ### How to install on your Pixel 7:
            1. Download the **`app-debug.apk`** file below on your Pixel 7.
            2. Tap the downloaded file in your notifications or Downloads folder.
            3. When prompted, tap **Install** (if asked, allow installation from unknown sources for this download).
            4. Launch NutriStep AI and start tracking your meals and steps!
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
